<!-- ==========================================================================
     icon.svg - BROWSER TAB ICON (FAVICON)
     ==========================================================================
     Next.js picks this file up automatically by name and links it from the
     document head of every page, replacing the default framework icon.

     It carries only the red chevron from the full wordmark. The complete mark
     is about nine times wider than it is tall, so squeezing it into the square
     a favicon must occupy leaves a stripe a few pixels high and unreadable at
     16 x 16. The chevron alone is near square and stays recognisable.

     Path data is copied verbatim from logo-svg/logogh-responsive.svg. The
     viewBox centres the chevron, whose own bounds are x 0-121.75 and
     y 4-98.75, inside a 138 unit square.
     ========================================================================== -->
